# Example only. Do not apply without production approval and secret review.
# The FastAPI batch route also validates INGESTION_API_TOKEN in production.
# Replace placeholders through an approved secret-delivery workflow; never commit
# the token value. The route itself rejects tickers outside 2330/2454.

name: fintrust-financial-refresh-semiconductor-eligible
description: Refresh official financial analysis for the reviewed semiconductor production scope
schedule: "15 7 * * 1-5"
timeZone: Asia/Taipei
httpTarget:
  uri: https://FINTRUST_API_URL/api/v1/financial/admin/refresh-all?years=5&trigger=scheduler&source_mode=official&batch_scope=eligible
  httpMethod: POST
  oidcToken:
    serviceAccountEmail: fintrust-scheduler@PROJECT_ID.iam.gserviceaccount.com
    audience: https://FINTRUST_API_URL
  headers:
    X-Ingestion-Token: SECRET_MANAGER_OR_APPROVED_RUNTIME_TOKEN_VALUE
  # The production job should set an attempt deadline compatible with the
  # bounded batch runner; the API remains protected by both auth layers.
  # gcloud scheduler jobs create http --attempt-deadline=1800s
retryConfig:
  retryCount: 2
  maxRetryDuration: 600s
  minBackoffDuration: 30s
  maxBackoffDuration: 120s
  maxDoublings: 2
