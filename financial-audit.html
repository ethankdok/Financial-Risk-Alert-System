<!doctype html><html lang="zh-Hant"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>企業健檢｜FinTrust</title><link rel="stylesheet" href="ft-site.css"><script defer src="member-auth.js"></script><script defer src="ft-i18n.js"></script><script defer src="ft-company-search.js"></script><script defer src="ft-demo.js"></script><script defer src="ft-live-financial.js"></script><script defer src="ft-site.js"></script><script defer src="ft-narrative.js"></script><script defer src="ft-mops-report.js"></script>
</head><body class="ft-app" data-ft-page="audit"><header id="ft-header"></header>
<main class="ft-wrap ft-report-page">
<div class="ft-page-title"><h1 data-i18n="nav.companyHealth">企業健檢</h1><span class="ft-api-status" data-ft-api-health></span></div>
<nav class="ft-health-jumplinks" aria-label="健檢內容">
<a href="#ft-sheet-report" data-i18n="health.reports">財務報表與異常分數</a>
<a href="#ft-narrative-health" data-i18n="health.jsd">文字漂移（JSD）</a>
<a href="#ft-health-live" data-i18n="health.live">營運指標與規則</a>
</nav>
<div class="ft-report-toolbar">
<div class="ft-field ft-company-field">
<label for="ft-company-search" data-i18n="audit.search">搜尋公司</label>
<div class="ft-company-input-wrap">
<input type="search" id="ft-company-search" class="ft-input" autocomplete="off" spellcheck="false" aria-label="公司代號或名稱" data-i18n-placeholder="audit.companyPlaceholder" placeholder="輸入股票代碼或公司名稱，例如 2330 台積電">
<div id="ft-company-suggestions" class="ft-search-list" role="listbox" hidden></div>
</div>
</div>
<div class="ft-field"><label for="ft-industry" data-i18n="audit.industry">產業（選填）</label><select class="ft-select" id="ft-industry"><option value="all" data-i18n="audit.allIndustries">全部產業</option></select></div>
<div class="ft-field"><label for="ft-year" data-i18n="audit.year">財報年度</label><select class="ft-select" id="ft-year"></select></div>
</div>
<div id="ft-company-data-status" class="ft-company-data-status" aria-live="polite"></div><div id="ft-sheet-report" class="ft-sheet-report" aria-live="polite"><div class="ft-skeleton" data-i18n="audit.loading">載入財務資料…</div></div>
<section id="ft-narrative-health" class="ft-panel ft-narrative-panel" aria-live="polite">
<div class="ft-panel-heading"><h2 data-i18n="health.jsdTitle">文字漂移與敘事差異</h2></div>
</section>
<section id="ft-health-live" class="ft-panel ft-secondary-audit">
<div id="ft-live-dashboard" aria-live="polite"></div>
<details class="ft-health-advanced"><summary data-i18n="health.advanced">進階查核操作</summary>
<div class="ft-panel-heading"><h2 data-i18n="audit.otherCompany">查核其他公司</h2><a href="financial-integrity.html" class="ft-inline-link" data-i18n="audit.advanced">完整分析工作台</a></div>
<form id="ft-audit-form" class="ft-audit-inline"><label for="ft-audit-ticker" data-i18n="audit.ticker">公司代號</label><input id="ft-audit-ticker" class="ft-input" inputmode="numeric" pattern="[0-9]{4,6}" placeholder="例：1785" required><button type="button" id="ft-audit-demo-run" class="ft-btn ft-btn-muted" data-i18n="demo.open">介面示範</button><button type="submit" class="ft-btn ft-btn-primary" id="ft-audit-run" data-i18n="audit.backendRun">執行查核</button></form>
<div id="ft-status" class="ft-status" role="status" aria-live="polite" hidden></div><a id="ft-advanced-link" class="ft-inline-link" href="financial-integrity.html"></a>
</details>
</section>
<div id="ft-result" class="ft-result" hidden aria-live="polite"></div>
</main><footer class="ft-footer ft-minimal-footer"><div class="ft-wrap"><span>© FinTrust</span></div></footer></body></html>
