name: Financial ML FY2013-2015 Three Stage Research
on:
  push:
    branches:
      - feature/financial-ml-fy2013-2015-three-stage-20261020
    paths:
      - fintrust_backend/research/financial_ml/fy2013_2015_stage1_freeze.py
      - fintrust_backend/research/financial_ml/fy2013_2015_stage2_labels.py
      - fintrust_backend/research/financial_ml/fy2013_2015_stage3_supervised.py
      - fintrust_backend/tests/test_financial_ml_fy2013_2015_three_stages.py
      - .github/workflows/financial-ml-fy2013-2015-three-stage.yml
  workflow_dispatch:
permissions:
  contents: read
jobs:
  locked_three_year_study:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install scientific runtime
        run: python -m pip install --disable-pip-version-check numpy scikit-learn joblib
      - name: Source locked three fiscal years, verified two-class approval, leak-safe model holdout
        working-directory: fintrust_backend
        run: python -m unittest discover -s tests -p test_financial_ml_fy2013_2015_three_stages.py -v
