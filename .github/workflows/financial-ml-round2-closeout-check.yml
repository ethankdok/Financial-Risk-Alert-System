name: Financial ML Round2 Closeout and Round3 Preflight

on:
  push:
    branches:
      - feature/financial-ml-round2-closeout-round3-handoff-20261020
    paths:
      - "fintrust_backend/research/financial_ml/round2_closeout_round3_bridge.py"
      - "fintrust_backend/research/financial_ml/round2_evidence_review.py"
      - "fintrust_backend/research/financial_ml/phase1_case_sources_seed.json"
      - "fintrust_backend/tests/test_financial_ml_round2_closeout_round3_bridge.py"
      - "fintrust_backend/tests/test_financial_ml_round2_evidence_review.py"
      - ".github/workflows/financial-ml-round2-closeout-check.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  round2-closeout:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Previous Round2 review acceptance
        working-directory: fintrust_backend
        run: python -m unittest discover -s tests -p test_financial_ml_round2_evidence_review.py -v
      - name: Round2 archive-integrity closeout and Round3 supervised-blocking preflight
        working-directory: fintrust_backend
        run: python -m unittest discover -s tests -p test_financial_ml_round2_closeout_round3_bridge.py -v
