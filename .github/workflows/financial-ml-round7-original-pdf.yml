name: Financial ML Round7 Original PDF Evidence
on:
  push:
    branches:
      - feature/financial-ml-round7-original-pdf-ingestion-20261020
    paths:
      - fintrust_backend/research/financial_ml/round7_original_pdf_review.py
      - fintrust_backend/tests/test_financial_ml_round7_original_pdf_review.py
      - .github/workflows/financial-ml-round7-original-pdf.yml
  workflow_dispatch:
permissions:
  contents: read
jobs:
  source_review:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install PDF reader
        run: python -m pip install --disable-pip-version-check pymupdf numpy scikit-learn joblib
      - name: Fail-closed original AI1 PDF evidence and isolated DB ingestion tests
        working-directory: fintrust_backend
        run: python -m unittest discover -s tests -p test_financial_ml_round7_original_pdf_review.py -v
