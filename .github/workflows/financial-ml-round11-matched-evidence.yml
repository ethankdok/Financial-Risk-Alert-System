name: Financial ML Round11 Same Year Source Approved Classifier
on:
  push:
    branches:
      - feature/financial-ml-round11-yearmatched-label-evidence-20261020
    paths:
      - fintrust_backend/research/financial_ml/round11_year_matched_evidence_gate.py
      - fintrust_backend/tests/test_financial_ml_round11_same_year_evidence.py
      - .github/workflows/financial-ml-round11-matched-evidence.yml
  workflow_dispatch:
permissions:
  contents: read
jobs:
  same_fiscal_year:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install ML dependencies
        run: python -m pip install --disable-pip-version-check numpy scikit-learn joblib
      - name: Validate same-FY controls, first-original evidence and 24mo label horizon
        working-directory: fintrust_backend
        run: python -m unittest discover -s tests -p test_financial_ml_round11_same_year_evidence.py -v
