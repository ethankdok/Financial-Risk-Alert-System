name: FinTrust Public 2017 Balance Archive Retry
on:
  push:
    branches: [feature/financial-ml-round2-binary-labels-20261024]
    paths: ['.github/workflows/financial-ml-mops-2017-balance-retry.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  official_2017_balance:
    runs-on: ubuntu-latest
    timeout-minutes: 7
    steps:
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install standard HTTP library
        run: python -m pip install --disable-pip-version-check requests
      - name: Re-query one failed public MOPS fiscal 2017 balance statement
        run: |
          python - <<'PY'
          import requests,time,hashlib,json
          s=requests.Session()
          s.headers.update({'User-Agent':'Mozilla/5.0 (compatible; financial research public archive)','Referer':'https://mopsov.twse.com.tw/mops/web/index'})
          url='https://mopsov.twse.com.tw/mops/web/ajax_t163sb05'
          data={'encodeURIComponent':'1','step':'1','firstin':'1','off':'1','isQuery':'Y','TYPEK':'sii','year':'106','season':'04'}
          result={'official_url':url,'query':data,'status':'NOT_OBTAINED'}
          for attempt in range(1,4):
            try:
              r=s.post(url,data=data,timeout=60)
              valid=r.status_code==200 and len(r.content)>100000 and b'FOR SECURITY' not in r.content
              print('RETRY',attempt,r.status_code,len(r.content),valid,flush=True)
              if valid:
                name='2017_sii_balance.html'
                open(name,'wb').write(r.content)
                result.update(status='ARCHIVED',size_bytes=len(r.content),sha256=hashlib.sha256(r.content).hexdigest(),filename=name)
                break
              if r.status_code in (403,429):break
            except requests.RequestException as exc:
              print('REQUEST_ERROR',str(exc)[:160],flush=True)
            time.sleep(8)
          open('retrieval_status.json','w').write(json.dumps(result,ensure_ascii=False,indent=2))
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: fintrust-mops-2017-sii-balance-retry
          path: |
            retrieval_status.json
            2017_sii_balance.html
          if-no-files-found: error
