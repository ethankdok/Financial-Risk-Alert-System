name: FinTrust Phase2 Public MOPS Whole-Market Financials 2013-2021
on:
  push:
    branches:
      - feature/financial-ml-round2-binary-labels-20261024
    paths:
      - '.github/workflows/financial-ml-public-bulk-2013-2021.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  public_allmarket_fy_2013_2021:
    runs-on: ubuntu-latest
    timeout-minutes: 24
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install public-source parser
        run: python -m pip install --disable-pip-version-check requests pandas lxml
      - name: Collect historical all-market fiscal-year reports with source hashes
        working-directory: fintrust_backend
        run: |
          python -m research.financial_ml.public_mops_bulk_annual_panel \
            --start 2013 --end 2021 \
            --markets sii otc --delay 2.5 \
            --out data/public_mops_marketwide_fy2013_2021
      - name: Upload public original HTML + derived nonfinancial annual financial panel
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: fintrust-public-mops-fy2013-2021-unlicensed
          path: fintrust_backend/data/public_mops_marketwide_fy2013_2021
          retention-days: 14
          if-no-files-found: error
