name: Second-company official transcript feasibility
on:
  push:
    branches: [feature/tsmc-quarterly-corpus]
    paths:
      - '.github/workflows/mediatek-source-feasibility.yml'
  workflow_dispatch:
  pull_request:
    paths:
      - '.github/workflows/mediatek-source-feasibility.yml'

jobs:
  official-transcript-discovery:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install -r requirements.txt
      - run: python scripts/discover_mediatek_transcripts.py
      - name: Try all official alternate Q3 covers before quarantining ambiguous documents
        run: python scripts/build_mediatek_corpus.py --start 2022 --end 2025
      - name: Compare raw metrics using same paired method; no inherited thresholds
        shell: bash
        run: |
          python - <<'PY'
          import csv
          from pathlib import Path
          p=Path('data/mediatek_corpus/mediatek_source_index.csv')
          with p.open(encoding='utf-8-sig') as f:
              rows=list(csv.DictReader(f))
          print("QUARANTINED_PERIODS",[(r['period'],r['note']) for r in rows if r['status'] != 'ok'])
          print("UNIQUE_APPROVED_DOCS",sum(r['status']=='ok' for r in rows))
          PY
          python scripts/calibrate_tsmc_shift.py --csv data/mediatek_corpus/mediatek_quarterly_text.csv --ticker 2454 --period1 2025Q3 --period2 2025Q4 --output data/mediatek_corpus/uncalibrated_raw_metrics.json || echo "Insufficient adjacent official MediaTek PDFs"
          python - <<'PY'
          from pathlib import Path
          import json,sys
          sys.path.insert(0,str(Path('scripts').resolve()))
          from calibrate_tsmc_shift import load
          from sensitivity_tsmc_shift import compare_versions
          path=Path('data/mediatek_corpus/mediatek_quarterly_text.csv')
          try:
              report=compare_versions(load(path,'2454'))
              Path('data/mediatek_corpus/sensitivity_report.json').write_text(json.dumps(report,indent=2,ensure_ascii=False),encoding='utf-8')
              for name,result in report['results'].items():
                  print("MEDIATEK_VARIANT",name,"target",result['target'],"history_pairs",result['history_pairs'],"thresholds",result['thresholds'])
          except (ValueError,KeyError) as e:
              print("MEDIATEK_REVIEW",e)
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: mediatek-official-source-candidates
          path: |
            data/mediatek_corpus/official_link_candidates.csv
            data/mediatek_corpus/mediatek_source_index.csv
            data/mediatek_corpus/uncalibrated_raw_metrics.json
            data/mediatek_corpus/sensitivity_report.json
          retention-days: 7
