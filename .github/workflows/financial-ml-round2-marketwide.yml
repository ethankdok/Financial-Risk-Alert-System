name: FinTrust Round2 Scale Official Company Universe

on:
  push:
    branches:
      - feature/financial-ml-round2-binary-labels-20261024
    paths:
      - '.github/workflows/financial-ml-round2-marketwide.yml'
      - 'fintrust_backend/research/financial_ml/round2_marketwide_universe.py'
      - 'fintrust_backend/tests/test_financial_ml_round2_marketwide_universe.py'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  official-universe:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    defaults:
      run:
        working-directory: fintrust_backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Run Round2 bulk schema and no-fake-Y tests
        run: python -m unittest discover -s tests -p 'test_financial_ml_round2_marketwide_universe.py' -v
      - name: Acquire official CURRENT-ONLY TWSE/TPEx profiles and produce 2013-2023 candidate grid
        run: python -m research.financial_ml.round2_marketwide_universe --out data/financial_ml/round2_marketwide
      - name: Verify provenance and genuine Y counts
        run: |
          python -c "import json,pathlib; p=pathlib.Path('data/financial_ml/round2_marketwide/round2_marketwide_report.json'); r=json.loads(p.read_text()); assert r['actual_binary_y_1']==7 and r['actual_binary_y_0']==18 and r['source_y_1_including_out_of_scope']==8 and r['source_silver_labels_total']==26; assert r['model_eligible_x_y_pairs']==0; assert r['candidate_issuer_year_positions']==r['issuer_rows_total_including_historical_seeds']*11; print('Verified in-range Y 7/18 and FY2024 Y=1 excluded from 2013-23 candidate grid', r['sources'])"
      - uses: actions/upload-artifact@v4
        with:
          name: fintrust-round2-marketwide-universe
          path: |
            fintrust_backend/data/financial_ml/round2_marketwide/round2_market_company_roster.csv
            fintrust_backend/data/financial_ml/round2_marketwide/round2_market_issuer_year_candidates.csv
            fintrust_backend/data/financial_ml/round2_marketwide/round2_marketwide_report.json
            fintrust_backend/data/financial_ml/round2_marketwide/source_snapshots/
          if-no-files-found: error
