name: FinTrust AAER Enhanced Experiment Guard Tests
on:
  push:
    branches:
      - feature/financial-ml-aaer-enhanced-20261020
    paths:
      - fintrust_backend/tests/test_financial_ml_aaer_enhanced_protocol.py
      - .github/workflows/financial-ml-enhanced-aaer-guards.yml
  workflow_dispatch:
permissions:
  contents: read
jobs:
  integrity:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Dependencies
        run: python -m pip install 'numpy>=1.26,<3' 'pandas>=2.1,<3' 'scikit-learn>=1.5,<2'
      - name: Verify engineered past-only features, time holdout, labels and issuer isolation
        working-directory: fintrust_backend
        run: python -m unittest discover -s tests -p test_financial_ml_aaer_enhanced_protocol.py -v
