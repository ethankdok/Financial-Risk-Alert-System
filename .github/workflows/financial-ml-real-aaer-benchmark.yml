name: FinTrust Real Human-Curated AAER 0/1 Training
on:
  push:
    branches:
      - feature/financial-ml-real-aaer-supervised-benchmark-20261020
    paths:
      - fintrust_backend/research/financial_ml/external_benchmark/published_aaer_real_supervised.py
      - .github/workflows/financial-ml-real-aaer-benchmark.yml
  workflow_dispatch:
permissions:
  contents: write
jobs:
  real_supervised_from_published_aaer:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"
      - name: Install real supervised training dependencies
        run: python -m pip install --disable-pip-version-check 'numpy>=1.26,<3' 'pandas>=2.1,<3' 'scikit-learn>=1.5,<2' 'joblib>=1.4,<2'
      - name: Download published original JAR 2020 human-curated AAER data
        run: |
          mkdir -p "$RUNNER_TEMP/fintrust-real-aaer"
          curl --fail --location --retry 4 --connect-timeout 30 --max-time 180 \
            https://raw.githubusercontent.com/JarFraud/FraudDetection/master/data_FraudDetection_JAR2020.csv \
            --output "$RUNNER_TEMP/fintrust-real-aaer/data_FraudDetection_JAR2020.csv"
          wc -c "$RUNNER_TEMP/fintrust-real-aaer/data_FraudDetection_JAR2020.csv"
          sha256sum "$RUNNER_TEMP/fintrust-real-aaer/data_FraudDetection_JAR2020.csv"
      - name: Run actual company-disjoint supervised classification on paper labels
        working-directory: fintrust_backend
        env:
          OMP_NUM_THREADS: '2'
          OPENBLAS_NUM_THREADS: '2'
          MKL_NUM_THREADS: '2'
        run: |
          python -m research.financial_ml.external_benchmark.published_aaer_real_supervised \
            --source-csv "$RUNNER_TEMP/fintrust-real-aaer/data_FraudDetection_JAR2020.csv" \
            --output-dir "$RUNNER_TEMP/fintrust-real-aaer/results"
      - name: Attach complete labels, holdout predictions, frozen model and JSON metrics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: fintrust-real-aaer-0-1-supervised-holdout
          path: ${{ runner.temp }}/fintrust-real-aaer/results/
          retention-days: 30
          if-no-files-found: warn
      - name: Publish metrics and provenance into standalone research branch
        if: success()
        run: |
          mkdir -p fintrust_backend/research/financial_ml/external_benchmark/results
          cp "$RUNNER_TEMP/fintrust-real-aaer/results/real_aaer_supervised_holdout_report.json" \
            fintrust_backend/research/financial_ml/external_benchmark/results/real_aaer_supervised_holdout_report.json
          git config user.name "fintrust-research-ci"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add fintrust_backend/research/financial_ml/external_benchmark/results/real_aaer_supervised_holdout_report.json
          git commit -m "research(ml): record real external AAER independently heldout fraud classification" || true
          git push origin HEAD || echo "Metrics available in Actions artifact even if GitHub token lacks branch write access."
