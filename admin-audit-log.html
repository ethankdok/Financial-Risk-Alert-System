<!doctype html><html lang="zh-Hant"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>操作紀錄｜管理後台</title><link rel="stylesheet" href="style.css"><script src="admin-auth.js"></script><script>AdminAuth.requireAuth();</script></head>
<body class="admin-body"><header class="admin-topbar"><div class="admin-topbar-inner"><a class="brand" href="admin-dashboard.html"><div class="brand-mark">FI</div><div class="brand-text"><strong>金融資訊真偽判斷與可信度風險提醒系統</strong><span>Administrator Console</span></div></a><div class="admin-user"></div></div></header>
<main class="admin-shell"><aside class="admin-sidebar"><div class="admin-sidebar-title">管理後台</div><nav><a href="admin-dashboard.html"><span>▦</span> 儀表板</a><a href="admin-keyword-extract.html"><span>⌕</span> 關鍵字擷取</a><a href="admin-keyword-manage.html"><span>⌘</span> 關鍵字管理</a><a href="admin-risk-feature-manage.html"><span>⚠</span> 風險特徵管理</a>
        <a href="admin-admin-manage.html"><span>♙</span> 管理員管理</a><a class="active" href="admin-audit-log.html"><span>≣</span> 操作紀錄</a></nav><div class="admin-sidebar-note"><strong>Audit Log</strong><p>追蹤是哪位管理員，在什麼時間，對哪一筆資料做了什麼修改。</p></div><a class="admin-back-link" href="index.html">← 返回前台</a></aside>
<section class="admin-main"><div class="admin-page-head"><div><span class="eyebrow">Audit Trail</span><h1>管理員操作紀錄</h1><p>保留登入、核准、修改、停用與刪除等後台活動，方便日後追蹤與稽核。</p></div><button id="clearLogs" class="secondary-btn" type="button">清除操作紀錄</button></div>
<div class="keyword-summary"><div class="keyword-summary-card"><span>紀錄總數</span><strong id="sumLogs">0</strong></div><div class="keyword-summary-card"><span>今日操作</span><strong id="sumToday">0</strong></div><div class="keyword-summary-card"><span>管理員數</span><strong id="sumAdmins">0</strong></div><div class="keyword-summary-card"><span>資料異動</span><strong id="sumChanges">0</strong></div></div>
<section class="admin-panel"><div class="keyword-toolbar"><label class="admin-field keyword-search"><span>搜尋</span><input id="q" type="search" placeholder="搜尋管理員、操作或資料…"></label><label class="admin-field"><span>管理員</span><select id="adminFilter"><option value="">全部</option></select></label><label class="admin-field"><span>操作</span><select id="actionFilter"><option value="">全部</option><option>新增</option><option>修改</option><option>刪除</option><option>核准</option><option>拒絕</option><option>啟用</option><option>停用</option><option>登入</option><option>登出</option></select></label></div>
<div class="keyword-table-wrap"><table class="keyword-table audit-table"><thead><tr><th>時間</th><th>管理員</th><th>操作</th><th>對象</th><th>內容摘要</th><th>異動內容</th></tr></thead><tbody id="auditRows"></tbody></table><div id="emptyAudit" class="keyword-empty" hidden>目前沒有符合條件的操作紀錄。</div></div></section></section></main>
<script>
let all=[];
(async()=>{await AdminAuth.mountUser();await reload();})();
async function reload(){all=await AdminAuth.logs();render();}
function render(){const qs=q.value.trim().toLowerCase(),af=adminFilter.value,act=actionFilter.value;sumLogs.textContent=all.length;const today=new Date().toISOString().slice(0,10);sumToday.textContent=all.filter(x=>(x.time||'').startsWith(today)).length;sumAdmins.textContent=new Set(all.map(x=>x.adminId)).size;sumChanges.textContent=all.filter(x=>['新增','修改','刪除','核准','拒絕','啟用','停用'].includes(x.action)).length;const admins=[...new Map(all.map(x=>[x.adminId,{id:x.adminId,name:x.adminName}])).values()];const cur=adminFilter.value;adminFilter.innerHTML='<option value="">全部</option>'+admins.map(x=>`<option value="${AdminAuth.escapeHtml(x.id)}">${AdminAuth.escapeHtml(x.name)} (${AdminAuth.escapeHtml(x.id)})</option>`).join('');adminFilter.value=cur;const f=all.filter(x=>(!qs||[x.adminName,x.adminId,x.action,x.target,x.summary].join(' ').toLowerCase().includes(qs))&&(!af||x.adminId===af)&&(!act||x.action===act));emptyAudit.hidden=f.length>0;auditRows.innerHTML=f.map(x=>`<tr><td class="keyword-muted">${AdminAuth.escapeHtml(x.time)}</td><td><strong>${AdminAuth.escapeHtml(x.adminName)}</strong><div class="keyword-muted">${AdminAuth.escapeHtml(x.adminId)} · ${AdminAuth.escapeHtml(x.role||'')}</div></td><td><span class="status-tag tag-blue">${AdminAuth.escapeHtml(x.action)}</span></td><td>${AdminAuth.escapeHtml(x.target)}</td><td>${AdminAuth.escapeHtml(x.summary)}</td><td class="audit-change">${formatChange(x)}</td></tr>`).join('')}
function formatChange(x){if(!x.before&&!x.after)return '—';const b=x.before?JSON.stringify(x.before,null,2):'—',a=x.after?JSON.stringify(x.after,null,2):'—';return `<details><summary>查看</summary><div><b>修改前</b><pre>${AdminAuth.escapeHtml(b)}</pre><b>修改後</b><pre>${AdminAuth.escapeHtml(a)}</pre></div></details>`}
['q','adminFilter','actionFilter'].forEach(id=>document.getElementById(id).addEventListener(id==='q'?'input':'change',render));clearLogs.onclick=async()=>{if(confirm('確定清除資料庫中的操作紀錄嗎？')){await AdminAuth.clearLogs();await reload();}};
</script></body></html>
