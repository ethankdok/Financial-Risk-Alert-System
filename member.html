<!doctype html>
<html lang="zh-Hant">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>會員中心</title>
  <link rel="stylesheet" href="style.css">
  <link rel="stylesheet" href="ui-humanize.css">
  <script src="member-auth.js"></script>
  <script>MemberAuth.requireMember();</script>
  <link rel="stylesheet" href="ft-site.css">
  <script defer src="ft-i18n.js"></script><script defer src="ft-site.js"></script>
</head>
<body class="ft-app ft-member-page" data-ft-page="member">
  <header id="ft-header"></header>
  <section class="page-hero"><div class="container"><h1 data-i18n="member.title">會員中心</h1></div></section>
  <div class="container layout">
    
    <main class="member-grid">
      <section class="content-card">
        <h2 data-i18n="member.profile">個人資料</h2>
        <form class="form-grid" id="profileForm">
          <div class="form-group"><label data-i18n="member.name">會員名稱</label><input class="form-control" name="display_name"></div>
          <div class="form-group"><label data-i18n="login.email">電子郵件</label><input class="form-control" name="email" type="email"></div>
          <div class="full form-status" id="profileStatus"></div>
          <div class="full"><button class="btn btn-secondary" type="submit" data-i18n="member.save">儲存修改</button></div>
        </form>
      </section>

      <section class="content-card">
        <div class="section-row"><div><h3 data-i18n="member.watchlist">追蹤公司</h3></div></div>
        <form class="watchlist-form" id="watchlistForm">
          <select class="form-control" name="ticker" id="watchlistTicker">
            <option value="">載入公司清單中…</option>
          </select>
          <button class="btn btn-primary" type="submit" data-i18n="member.follow">追蹤</button>
        </form>
        <div class="watchlist-grid" id="watchlistItems"></div>
      </section>

      <section class="content-card">
        <h3 data-i18n="member.notifications">提醒偏好</h3>
        <form class="preference-grid" id="preferenceForm">
          <label><input type="checkbox" name="email_enabled"> <span data-i18n="member.email">電子郵件通知</span></label>
          <label><input type="checkbox" name="important_alerts"> <span data-i18n="member.important">重要／高風險提醒</span></label>
          <label><input type="checkbox" name="material_event_alerts"> <span data-i18n="member.events">新重大訊息</span></label>
          <label><input type="checkbox" name="conference_alerts"> <span data-i18n="member.conference">新法說會／官方證據</span></label>
          <label><input type="checkbox" name="narrative_shift_alerts"> <span data-i18n="member.narrative">敘事變化提醒</span></label>
          <label><span data-i18n="member.digest">摘要頻率</span><select class="form-control" name="digest_frequency"><option value="daily" data-i18n="member.daily">每日</option><option value="weekly" data-i18n="member.weekly">每週</option><option value="off" data-i18n="member.off">關閉摘要</option></select></label>
          <div class="full form-status" id="preferenceStatus"></div>
          <button class="btn btn-secondary" type="submit" data-i18n="member.savePrefs">儲存偏好</button>
        </form>
      </section>

      <section class="content-card">
        <h3 data-i18n="member.noticeHistory">最近通知紀錄</h3>
        <div class="table-wrap"><table class="data-table"><thead><tr><th data-i18n="member.time">時間</th><th data-i18n="member.company">公司</th><th data-i18n="member.type">類型</th><th data-i18n="member.state">狀態</th><th data-i18n="member.subject">主旨</th></tr></thead><tbody id="notificationRows"><tr><td colspan="5">讀取中</td></tr></tbody></table></div>
      </section>
      <section class="content-card">
        <h3 data-i18n="member.analysisHistory">我的分析紀錄</h3>
        <p class="muted-text" data-i18n="member.noSavedHistory">查核報告尚未啟用跨裝置保存。</p>
        <div id="memberAnalysisHistory" class="muted-text" aria-live="polite">讀取分析歷史狀態中…</div>
        <a class="ft-inline-link" href="analysis.html" data-i18n="member.newAnalysis">建立新的整合查核</a>
      </section>
    </main>
  </div>
  <script>
  // Filled from the canonical FinTrust company list; there is no page-local ticker list.
  const companyNames={};
  async function loadCompanyOptions(){
    const select=document.getElementById('watchlistTicker');
    try{
      const response=await fetch('/api/financial/companies',{headers:{Accept:'application/json'}});
      const payload=await response.json();
      const companies=(payload.data&&payload.data.companies)||payload.companies||[];
      companies.forEach(company=>{companyNames[company.ticker]=company.name;});
      select.innerHTML=companies.map(company=>`<option value="${MemberAuth.escapeHtml(company.ticker)}">${MemberAuth.escapeHtml(company.ticker)} ${MemberAuth.escapeHtml(company.name||'')}</option>`).join('')||'<option value="">目前沒有可追蹤的公司</option>';
      if(companies.some(company=>String(company.ticker)==='2454'))select.value='2454';
    }catch(_){
      select.innerHTML='<option value="">公司清單暫時無法讀取</option>';
    }
  }
  async function loadMemberPage(){
    const member=await MemberAuth.requireMember(); if(!member)return;
    MemberAuth.mountNav(member);
    const profile=document.getElementById('profileForm');
    profile.display_name.value=member.display_name||'';
    profile.email.value=member.email||'';
    await Promise.all([loadCompanyOptions(),loadWatchlist(),loadPreferences(),loadNotifications()]);
  }
  async function loadWatchlist(){
    const data=await MemberAuth.api('/api/member/watchlist');
    const target=document.getElementById('watchlistItems');
    target.innerHTML=(data.items||[]).map(item=>`<article class="watchlist-item"><div><strong>${MemberAuth.escapeHtml(item.ticker)} ${MemberAuth.escapeHtml(item.company_name||companyNames[item.ticker]||'')}</strong><span>${Number(item.alert_enabled)?'提醒開啟':'提醒關閉'}</span></div><div><button class="mini-btn" data-toggle="${MemberAuth.escapeHtml(item.ticker)}">${Number(item.alert_enabled)?'關閉提醒':'開啟提醒'}</button><button class="mini-btn danger" data-remove="${MemberAuth.escapeHtml(item.ticker)}">取消追蹤</button></div></article>`).join('')||'<p class="muted-text">尚未追蹤公司。</p>';
    target.querySelectorAll('[data-toggle]').forEach(btn=>btn.addEventListener('click',async()=>{const ticker=btn.dataset.toggle;await MemberAuth.api(`/api/member/watchlist/${ticker}`,{method:'PATCH',body:JSON.stringify({alert_enabled:btn.textContent.includes('開啟')})});loadWatchlist();}));
    target.querySelectorAll('[data-remove]').forEach(btn=>btn.addEventListener('click',async()=>{await MemberAuth.api(`/api/member/watchlist/${btn.dataset.remove}`,{method:'DELETE'});loadWatchlist();}));
  }
  async function loadPreferences(){
    const {preferences:p}=await MemberAuth.api('/api/member/notification-preferences');
    const form=document.getElementById('preferenceForm');
    ['email_enabled','important_alerts','material_event_alerts','conference_alerts','narrative_shift_alerts'].forEach(name=>{form[name].checked=Number(p[name])===1;});
    form.digest_frequency.value=p.digest_frequency||'daily';
  }
  async function loadNotifications(){
    const data=await MemberAuth.api('/api/member/notifications');
    const rows=document.getElementById('notificationRows');
    rows.innerHTML=(data.items||[]).map(item=>`<tr><td>${MemberAuth.escapeHtml(item.created_at)}</td><td>${MemberAuth.escapeHtml(item.ticker)}</td><td>${MemberAuth.escapeHtml(item.notification_type)}</td><td><span class="status-tag ${item.status==='sent'?'tag-green':item.status==='suppressed_duplicate'?'tag-blue':'tag-orange'}">${MemberAuth.escapeHtml(item.status)}</span></td><td>${MemberAuth.escapeHtml(item.subject)}</td></tr>`).join('')||'<tr><td colspan="5">尚無通知紀錄</td></tr>';
  }
  document.getElementById('profileForm').addEventListener('submit',async event=>{event.preventDefault();const form=event.currentTarget;const data=await MemberAuth.api('/api/member/profile',{method:'PUT',body:JSON.stringify({display_name:form.display_name.value,email:form.email.value})});document.getElementById('profileStatus').textContent='已儲存';MemberAuth.mountNav(data.member);});
  document.getElementById('watchlistForm').addEventListener('submit',async event=>{event.preventDefault();const ticker=event.currentTarget.ticker.value;if(!ticker)return;await MemberAuth.api('/api/member/watchlist',{method:'POST',body:JSON.stringify({ticker,company_name:companyNames[ticker],alert_enabled:true})});loadWatchlist();});
  document.getElementById('preferenceForm').addEventListener('submit',async event=>{event.preventDefault();const form=event.currentTarget;await MemberAuth.api('/api/member/notification-preferences',{method:'PUT',body:JSON.stringify({email_enabled:form.email_enabled.checked,digest_frequency:form.digest_frequency.value,important_alerts:form.important_alerts.checked,material_event_alerts:form.material_event_alerts.checked,conference_alerts:form.conference_alerts.checked,narrative_shift_alerts:form.narrative_shift_alerts.checked})});document.getElementById('preferenceStatus').textContent='提醒偏好已儲存';});
  async function loadAnalysisHistory(){
    const target=document.getElementById('memberAnalysisHistory');
    try{const data=await MemberAuth.api('/api/member/analysis-history');
      const records=data.items||[];
      target.textContent=records.length?('目前有 '+records.length+' 筆分析紀錄。'):(data.message||'目前尚無個人分析紀錄。');
    }catch(e){target.textContent='分析歷史狀態暫時無法讀取。';}
  }
  loadMemberPage();
  loadAnalysisHistory();
  </script>
</body>
</html>
