<!doctype html>
<html lang="zh-Hant">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>會員登入</title>
  <link rel="stylesheet" href="style.css">
  <link rel="stylesheet" href="ui-humanize.css">
  <script src="member-auth.js"></script>
  <link rel="stylesheet" href="ft-site.css">
  <script defer src="ft-i18n.js"></script><script defer src="ft-site.js"></script><script defer src="ft-google-signin.js"></script>
</head>
<body class="ft-app" data-ft-page="auth">
  <header id="ft-header"></header>
  <main class="login-shell">
    <form class="auth-card" id="memberLoginForm">
      <span class="eyebrow" data-i18n="login.title">會員登入</span>
      <h1 data-i18n="login.welcome">歡迎回來</h1>
      
      <button type="button" id="ft-google-signin" class="ft-google-btn"><span aria-hidden="true" class="ft-google-mark">G</span><span data-i18n="login.google">使用 Google 帳號登入</span></button><div class="ft-auth-divider" data-i18n="login.emailOr">或使用 Email 登入</div><div class="form-group"><label data-i18n="login.email">電子郵件</label><input class="form-control" name="email" autocomplete="email" required></div>
      <div class="form-group"><label data-i18n="login.password">密碼</label><input class="form-control" name="password" type="password" autocomplete="current-password" required></div>
      <div class="auth-error" id="memberLoginError" hidden></div>
      <button class="btn btn-primary" style="width:100%" type="submit" data-i18n="login.submit">登入</button>
      <p class="auth-switch"><span data-i18n="login.noAccount">尚未註冊？</span> <a href="register.html" data-i18n="login.create">建立會員帳號</a></p>
      
    </form>
  </main>
  <script>
  document.getElementById('memberLoginForm').addEventListener('submit',async event=>{
    event.preventDefault();
    const form=event.currentTarget;
    const error=document.getElementById('memberLoginError');
    error.hidden=true;
    try{
      await MemberAuth.api('/api/member/auth/login',{method:'POST',body:JSON.stringify({email:form.email.value,password:form.password.value})});
      const next=new URLSearchParams(location.search).get('next')||'member.html';
      location.href=/^[a-z0-9_-]+\.html(?:\?[^#]*)?$/i.test(next)?next:'member.html';
    }catch(exc){
      error.textContent=exc.message;
      error.hidden=false;
    }
  });
  </script>
</body>
</html>
