<!doctype html>
<html lang="zh-Hant">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>會員登入</title>
  <link rel="stylesheet" href="style.css">
  <link rel="stylesheet" href="ui-humanize.css">
  <script src="member-auth.js"></script>
  <link rel="stylesheet" href="ft-site.css">
  <script defer src="ft-i18n.js"></script><script defer src="ft-site.js"></script><script defer src="ft-google-signin.js"></script>
</head>
<body class="ft-app" data-ft-page="auth">
  <header id="ft-header"></header>
  <main class="login-shell">
    <form class="auth-card" id="memberLoginForm">
      <span class="eyebrow" data-i18n="login.title">會員登入</span>
      <h1 data-i18n="login.welcome">歡迎回來</h1>
      
      <button type="button" id="ft-google-signin" class="ft-google-btn"><svg class="ft-google-logo" aria-hidden="true" focusable="false" width="18" height="18" viewBox="0 0 48 48" xmlns="http://www.w3.org/2000/svg"><path fill="#EA4335" d="M24 9.5c3.54 0 6.71 1.22 9.21 3.6l6.85-6.85C35.9 2.38 30.47 0 24 0 14.62 0 6.51 5.38 2.56 13.22l7.98 6.19C12.43 13.72 17.74 9.5 24 9.5Z"/><path fill="#4285F4" d="M46.98 24.55c0-1.57-.15-3.09-.38-4.55H24v9.02h12.94c-.58 2.96-2.25 5.48-4.77 7.18l7.73 6C44.41 38.04 46.98 31.91 46.98 24.55Z"/><path fill="#FBBC05" d="M10.53 28.59c-.48-1.45-.75-2.99-.75-4.59s.27-3.14.76-4.59l-7.98-6.19C.93 16.46 0 20.12 0 24s.93 7.54 2.56 10.78l7.97-6.19Z"/><path fill="#34A853" d="M24 48c6.48 0 11.93-2.13 15.9-5.8l-7.73-6C30.02 37.65 27.25 38.5 24 38.5c-6.26 0-11.57-4.22-13.47-9.91l-7.98 6.19C6.51 42.62 14.62 48 24 48Z"/></svg><span data-i18n="login.google">使用 Google 帳號登入</span></button><div class="ft-auth-divider" data-i18n="login.emailOr">或使用 Email 登入</div><div class="form-group"><label for="ft-auth-email" data-i18n="login.email">電子郵件</label><input id="ft-auth-email" class="form-control" name="email" type="email" autocomplete="email" required></div>
      <div class="form-group"><label for="ft-auth-password" data-i18n="login.password">密碼</label><input id="ft-auth-password" class="form-control" name="password" type="password" autocomplete="current-password" required></div>
      <div class="auth-error" id="memberLoginError" role="alert" hidden></div><p id="memberAuthStatus" role="status" hidden></p><p class="ft-auth-help"><button class="ft-auth-text" type="button" id="ft-reset-password" data-i18n="login.reset">忘記密碼？</button> <button class="ft-auth-text" type="button" id="ft-resend-verification" data-i18n="login.resend" hidden>重寄驗證信</button></p>
      <button class="btn btn-primary" style="width:100%" type="submit" data-i18n="login.submit">登入</button>
      <p class="auth-switch"><span data-i18n="login.noAccount">尚未註冊？</span> <a href="register.html" data-i18n="login.create">建立會員帳號</a></p>
      
    <a class="ft-member-demo-link" href="member-demo.html" data-i18n="demo.memberLink">體驗會員中心介面</a></form>
  </main>
</body>
</html>
